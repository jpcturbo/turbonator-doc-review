<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <defs>
    <!-- Diagonal stripe pattern for breakpoint cells -->
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(59,130,246,0.4)" stroke-width="3"/>
    </pattern>
    <!-- Lighter stripes for affected cells -->
    <pattern id="lightStripes" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(59,130,246,0.2)" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="700" height="450" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="350" y="25" fill="#cdd6f4" font-family="system-ui" font-size="16" text-anchor="middle" font-weight="bold">Influence Zone Highlighting</text>

  <!-- LEFT SIDE: Hover State -->
  <text x="170" y="55" fill="#89b4fa" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="bold">Tier 1: Hover (Lightweight)</text>

  <!-- Hover grid (5x5) -->
  <g transform="translate(40, 70)">
    <!-- Base cells -->
    <rect x="0" y="0" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="52" y="0" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="104" y="0" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="156" y="0" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="208" y="0" width="52" height="40" fill="#45475a" stroke="#313244"/>

    <rect x="0" y="40" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="52" y="40" width="52" height="40" fill="#585b70" stroke="#3b82f6" stroke-width="1"/>
    <rect x="104" y="40" width="52" height="40" fill="#585b70" stroke="#3b82f6" stroke-width="1"/>
    <rect x="156" y="40" width="52" height="40" fill="#585b70" stroke="#3b82f6" stroke-width="1"/>
    <rect x="208" y="40" width="52" height="40" fill="#45475a" stroke="#313244"/>

    <rect x="0" y="80" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="52" y="80" width="52" height="40" fill="#585b70" stroke="#3b82f6" stroke-width="1"/>
    <!-- Hovered cell -->
    <rect x="104" y="80" width="52" height="40" fill="#6c7086" stroke="#3b82f6" stroke-width="2"/>
    <rect x="156" y="80" width="52" height="40" fill="#585b70" stroke="#3b82f6" stroke-width="1"/>
    <rect x="208" y="80" width="52" height="40" fill="#45475a" stroke="#313244"/>

    <rect x="0" y="120" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="52" y="120" width="52" height="40" fill="#585b70" stroke="#3b82f6" stroke-width="1"/>
    <rect x="104" y="120" width="52" height="40" fill="#585b70" stroke="#3b82f6" stroke-width="1"/>
    <rect x="156" y="120" width="52" height="40" fill="#585b70" stroke="#3b82f6" stroke-width="1"/>
    <rect x="208" y="120" width="52" height="40" fill="#45475a" stroke="#313244"/>

    <rect x="0" y="160" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="52" y="160" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="104" y="160" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="156" y="160" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="208" y="160" width="52" height="40" fill="#45475a" stroke="#313244"/>

    <!-- Cursor indicator -->
    <circle cx="130" cy="100" r="4" fill="#f9e2af"/>
  </g>

  <!-- Hover legend -->
  <g transform="translate(40, 285)">
    <rect x="0" y="0" width="20" height="14" fill="#6c7086" stroke="#3b82f6" stroke-width="2"/>
    <text x="28" y="11" fill="#a6adc8" font-family="system-ui" font-size="11">Hovered cell</text>

    <rect x="0" y="22" width="20" height="14" fill="#585b70" stroke="#3b82f6" stroke-width="1"/>
    <text x="28" y="33" fill="#a6adc8" font-family="system-ui" font-size="11">Affected zone (subtle)</text>
  </g>

  <!-- Divider -->
  <line x1="350" y1="50" x2="350" y2="420" stroke="#585b70" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- RIGHT SIDE: Edit Mode -->
  <text x="525" y="55" fill="#f9e2af" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="bold">Tier 2: Edit Mode (Full Effects)</text>

  <!-- Edit mode grid (5x5) -->
  <g transform="translate(395, 70)">
    <!-- Base cells -->
    <rect x="0" y="0" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="52" y="0" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="104" y="0" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="156" y="0" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="208" y="0" width="52" height="40" fill="#45475a" stroke="#313244"/>

    <!-- Row 2: top of zone -->
    <rect x="0" y="40" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <!-- Breakpoint cell (top-left) with stripes and top+left border -->
    <rect x="52" y="40" width="52" height="40" fill="url(#stripes)" stroke="#313244"/>
    <line x1="52" y1="40" x2="104" y2="40" stroke="#3b82f6" stroke-width="3"/>
    <line x1="52" y1="40" x2="52" y2="80" stroke="#3b82f6" stroke-width="3"/>
    <!-- Affected cell with light stripes and top border -->
    <rect x="104" y="40" width="52" height="40" fill="url(#lightStripes)" stroke="#313244"/>
    <line x1="104" y1="40" x2="156" y2="40" stroke="#3b82f6" stroke-width="3"/>
    <!-- Breakpoint cell (top-right) with stripes and top+right border -->
    <rect x="156" y="40" width="52" height="40" fill="url(#stripes)" stroke="#313244"/>
    <line x1="156" y1="40" x2="208" y2="40" stroke="#3b82f6" stroke-width="3"/>
    <line x1="208" y1="40" x2="208" y2="80" stroke="#3b82f6" stroke-width="3"/>
    <rect x="208" y="40" width="52" height="40" fill="#45475a" stroke="#313244"/>

    <!-- Row 3: middle of zone -->
    <rect x="0" y="80" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <!-- Affected cell with left border -->
    <rect x="52" y="80" width="52" height="40" fill="url(#lightStripes)" stroke="#313244"/>
    <line x1="52" y1="80" x2="52" y2="120" stroke="#3b82f6" stroke-width="3"/>
    <!-- EDITING CELL - clean white background, input box -->
    <rect x="104" y="80" width="52" height="40" fill="#cdd6f4" stroke="#f9e2af" stroke-width="3"/>
    <rect x="108" y="88" width="44" height="24" fill="white" stroke="#89b4fa" stroke-width="1" rx="2"/>
    <text x="130" y="105" fill="#1e1e2e" font-family="monospace" font-size="12" text-anchor="middle">14.2</text>
    <!-- Affected cell with right border -->
    <rect x="156" y="80" width="52" height="40" fill="url(#lightStripes)" stroke="#313244"/>
    <line x1="208" y1="80" x2="208" y2="120" stroke="#3b82f6" stroke-width="3"/>
    <rect x="208" y="80" width="52" height="40" fill="#45475a" stroke="#313244"/>

    <!-- Row 4: bottom of zone -->
    <rect x="0" y="120" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <!-- Breakpoint cell (bottom-left) with stripes and bottom+left border -->
    <rect x="52" y="120" width="52" height="40" fill="url(#stripes)" stroke="#313244"/>
    <line x1="52" y1="160" x2="104" y2="160" stroke="#3b82f6" stroke-width="3"/>
    <line x1="52" y1="120" x2="52" y2="160" stroke="#3b82f6" stroke-width="3"/>
    <!-- Affected cell with bottom border -->
    <rect x="104" y="120" width="52" height="40" fill="url(#lightStripes)" stroke="#313244"/>
    <line x1="104" y1="160" x2="156" y2="160" stroke="#3b82f6" stroke-width="3"/>
    <!-- Breakpoint cell (bottom-right) with stripes and bottom+right border -->
    <rect x="156" y="120" width="52" height="40" fill="url(#stripes)" stroke="#313244"/>
    <line x1="156" y1="160" x2="208" y2="160" stroke="#3b82f6" stroke-width="3"/>
    <line x1="208" y1="120" x2="208" y2="160" stroke="#3b82f6" stroke-width="3"/>
    <rect x="208" y="120" width="52" height="40" fill="#45475a" stroke="#313244"/>

    <!-- Row 5 -->
    <rect x="0" y="160" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="52" y="160" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="104" y="160" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="156" y="160" width="52" height="40" fill="#45475a" stroke="#313244"/>
    <rect x="208" y="160" width="52" height="40" fill="#45475a" stroke="#313244"/>

    <!-- Glow effect around zone -->
    <rect x="52" y="40" width="156" height="120" fill="none" stroke="rgba(59,130,246,0.3)" stroke-width="6" filter="url(#glow)"/>
  </g>

  <!-- Edit mode legend -->
  <g transform="translate(395, 285)">
    <rect x="0" y="0" width="20" height="14" fill="#cdd6f4" stroke="#f9e2af" stroke-width="2"/>
    <text x="28" y="11" fill="#a6adc8" font-family="system-ui" font-size="11">Editing cell (input active)</text>

    <rect x="0" y="22" width="20" height="14" fill="url(#stripes)" stroke="#313244"/>
    <line x1="0" y1="22" x2="20" y2="22" stroke="#3b82f6" stroke-width="2"/>
    <text x="28" y="33" fill="#a6adc8" font-family="system-ui" font-size="11">Breakpoint cells (diagonal stripes)</text>

    <rect x="0" y="44" width="20" height="14" fill="url(#lightStripes)" stroke="#313244"/>
    <text x="28" y="55" fill="#a6adc8" font-family="system-ui" font-size="11">Affected cells (light stripes)</text>

    <line x1="0" y1="70" x2="20" y2="70" stroke="#3b82f6" stroke-width="3"/>
    <text x="28" y="74" fill="#a6adc8" font-family="system-ui" font-size="11">Perimeter border (zone boundary)</text>
  </g>

  <!-- Bottom explanation -->
  <text x="350" y="400" fill="#a6adc8" font-family="system-ui" font-size="11" text-anchor="middle">Hover shows subtle feedback. Edit mode shows dramatic visual treatment with perimeter borders.</text>
  <text x="350" y="420" fill="#a6adc8" font-family="system-ui" font-size="11" text-anchor="middle">Breakpoint cells are the source table points that will be modified. Affected cells update via interpolation.</text>
</svg>
