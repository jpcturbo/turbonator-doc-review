<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="33%" style="stop-color:#22c55e"/>
      <stop offset="66%" style="stop-color:#eab308"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="300" y="30" fill="#cdd6f4" font-family="system-ui" font-size="16" text-anchor="middle" font-weight="bold">2D Heatmap View - Part Throttle Fuel Map</text>

  <!-- Y-axis label -->
  <text x="20" y="220" fill="#a6adc8" font-family="system-ui" font-size="12" text-anchor="middle" transform="rotate(-90,20,220)">MAP (psi)</text>

  <!-- X-axis label -->
  <text x="330" y="385" fill="#a6adc8" font-family="system-ui" font-size="12" text-anchor="middle">RPM</text>

  <!-- Grid cells (8x6) -->
  <!-- Row headers (MAP) -->
  <text x="55" y="75" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="end">15</text>
  <text x="55" y="125" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="end">10</text>
  <text x="55" y="175" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="end">5</text>
  <text x="55" y="225" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="end">0</text>
  <text x="55" y="275" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="end">-5</text>
  <text x="55" y="325" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="end">-10</text>

  <!-- Column headers (RPM) -->
  <text x="95" y="355" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">1000</text>
  <text x="160" y="355" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">2000</text>
  <text x="225" y="355" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">3000</text>
  <text x="290" y="355" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">4000</text>
  <text x="355" y="355" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">5000</text>
  <text x="420" y="355" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">6000</text>
  <text x="485" y="355" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">7000</text>
  <text x="550" y="355" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">8000</text>

  <!-- Heatmap cells - Row 1 (15 psi - rich/red) -->
  <rect x="65" y="55" width="60" height="45" fill="#dc2626" stroke="#313244" stroke-width="1"/>
  <rect x="130" y="55" width="60" height="45" fill="#ea580c" stroke="#313244" stroke-width="1"/>
  <rect x="195" y="55" width="60" height="45" fill="#f97316" stroke="#313244" stroke-width="1"/>
  <rect x="260" y="55" width="60" height="45" fill="#ef4444" stroke="#313244" stroke-width="1"/>
  <rect x="325" y="55" width="60" height="45" fill="#dc2626" stroke="#313244" stroke-width="1"/>
  <rect x="390" y="55" width="60" height="45" fill="#b91c1c" stroke="#313244" stroke-width="1"/>
  <rect x="455" y="55" width="60" height="45" fill="#991b1b" stroke="#313244" stroke-width="1"/>
  <rect x="520" y="55" width="60" height="45" fill="#7f1d1d" stroke="#313244" stroke-width="1"/>

  <!-- Row 2 (10 psi) -->
  <rect x="65" y="105" width="60" height="45" fill="#f97316" stroke="#313244" stroke-width="1"/>
  <rect x="130" y="105" width="60" height="45" fill="#eab308" stroke="#313244" stroke-width="1"/>
  <rect x="195" y="105" width="60" height="45" fill="#facc15" stroke="#313244" stroke-width="1"/>
  <rect x="260" y="105" width="60" height="45" fill="#f97316" stroke="#313244" stroke-width="1"/>
  <rect x="325" y="105" width="60" height="45" fill="#ea580c" stroke="#313244" stroke-width="1"/>
  <rect x="390" y="105" width="60" height="45" fill="#dc2626" stroke="#313244" stroke-width="1"/>
  <rect x="455" y="105" width="60" height="45" fill="#b91c1c" stroke="#313244" stroke-width="1"/>
  <rect x="520" y="105" width="60" height="45" fill="#991b1b" stroke="#313244" stroke-width="1"/>

  <!-- Row 3 (5 psi) -->
  <rect x="65" y="155" width="60" height="45" fill="#a3e635" stroke="#313244" stroke-width="1"/>
  <rect x="130" y="155" width="60" height="45" fill="#84cc16" stroke="#313244" stroke-width="1"/>
  <rect x="195" y="155" width="60" height="45" fill="#eab308" stroke="#313244" stroke-width="1"/>
  <rect x="260" y="155" width="60" height="45" fill="#facc15" stroke="#313244" stroke-width="1"/>
  <rect x="325" y="155" width="60" height="45" fill="#f97316" stroke="#313244" stroke-width="1"/>
  <rect x="390" y="155" width="60" height="45" fill="#ea580c" stroke="#313244" stroke-width="1"/>
  <rect x="455" y="155" width="60" height="45" fill="#dc2626" stroke="#313244" stroke-width="1"/>
  <rect x="520" y="155" width="60" height="45" fill="#b91c1c" stroke="#313244" stroke-width="1"/>

  <!-- Row 4 (0 psi) -->
  <rect x="65" y="205" width="60" height="45" fill="#22c55e" stroke="#313244" stroke-width="1"/>
  <rect x="130" y="205" width="60" height="45" fill="#4ade80" stroke="#313244" stroke-width="1"/>
  <rect x="195" y="205" width="60" height="45" fill="#84cc16" stroke="#313244" stroke-width="1"/>
  <rect x="260" y="205" width="60" height="45" fill="#a3e635" stroke="#313244" stroke-width="1"/>
  <rect x="325" y="205" width="60" height="45" fill="#eab308" stroke="#313244" stroke-width="1"/>
  <rect x="390" y="205" width="60" height="45" fill="#f97316" stroke="#313244" stroke-width="1"/>
  <rect x="455" y="205" width="60" height="45" fill="#ea580c" stroke="#313244" stroke-width="1"/>
  <rect x="520" y="205" width="60" height="45" fill="#dc2626" stroke="#313244" stroke-width="1"/>

  <!-- Row 5 (-5 psi) -->
  <rect x="65" y="255" width="60" height="45" fill="#3b82f6" stroke="#313244" stroke-width="1"/>
  <rect x="130" y="255" width="60" height="45" fill="#22d3ee" stroke="#313244" stroke-width="1"/>
  <rect x="195" y="255" width="60" height="45" fill="#22c55e" stroke="#313244" stroke-width="1"/>
  <rect x="260" y="255" width="60" height="45" fill="#4ade80" stroke="#313244" stroke-width="1"/>
  <rect x="325" y="255" width="60" height="45" fill="#84cc16" stroke="#313244" stroke-width="1"/>
  <rect x="390" y="255" width="60" height="45" fill="#a3e635" stroke="#313244" stroke-width="1"/>
  <rect x="455" y="255" width="60" height="45" fill="#eab308" stroke="#313244" stroke-width="1"/>
  <rect x="520" y="255" width="60" height="45" fill="#f97316" stroke="#313244" stroke-width="1"/>

  <!-- Row 6 (-10 psi - lean/blue) -->
  <rect x="65" y="305" width="60" height="45" fill="#1e40af" stroke="#313244" stroke-width="1"/>
  <rect x="130" y="305" width="60" height="45" fill="#2563eb" stroke="#313244" stroke-width="1"/>
  <rect x="195" y="305" width="60" height="45" fill="#3b82f6" stroke="#313244" stroke-width="1"/>
  <rect x="260" y="305" width="60" height="45" fill="#22d3ee" stroke="#313244" stroke-width="1"/>
  <rect x="325" y="305" width="60" height="45" fill="#22c55e" stroke="#313244" stroke-width="1"/>
  <rect x="390" y="305" width="60" height="45" fill="#4ade80" stroke="#313244" stroke-width="1"/>
  <rect x="455" y="305" width="60" height="45" fill="#84cc16" stroke="#313244" stroke-width="1"/>
  <rect x="520" y="305" width="60" height="45" fill="#a3e635" stroke="#313244" stroke-width="1"/>

  <!-- Cell values (sample) -->
  <text x="95" y="82" fill="white" font-family="monospace" font-size="11" text-anchor="middle">11.2</text>
  <text x="160" y="82" fill="white" font-family="monospace" font-size="11" text-anchor="middle">11.5</text>
  <text x="225" y="82" fill="white" font-family="monospace" font-size="11" text-anchor="middle">11.8</text>
  <text x="290" y="82" fill="white" font-family="monospace" font-size="11" text-anchor="middle">11.4</text>

  <!-- Legend -->
  <rect x="65" y="365" width="200" height="12" fill="url(#heatGrad)" rx="2"/>
  <text x="65" y="390" fill="#a6adc8" font-family="system-ui" font-size="9">Rich (11:1)</text>
  <text x="265" y="390" fill="#a6adc8" font-family="system-ui" font-size="9" text-anchor="end">Lean (16:1)</text>
</svg>
