<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="surfaceGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="25%" style="stop-color:#22c55e"/>
      <stop offset="50%" style="stop-color:#eab308"/>
      <stop offset="75%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="300" y="25" fill="#cdd6f4" font-family="system-ui" font-size="16" text-anchor="middle" font-weight="bold">3D Surface Plot - Fuel Map Visualization</text>

  <!-- 3D wireframe surface (isometric approximation) -->
  <g transform="translate(100, 80)">
    <!-- Back wall (Y-Z plane) -->
    <polygon points="0,200 0,50 150,0 150,150" fill="#313244" stroke="#45475a"/>

    <!-- Bottom plane (X-Y) -->
    <polygon points="0,200 400,200 400,150 150,150" fill="#1e1e2e" stroke="#45475a"/>

    <!-- Grid lines on bottom -->
    <line x1="0" y1="200" x2="150" y2="150" stroke="#45475a" stroke-width="0.5"/>
    <line x1="100" y1="200" x2="200" y2="150" stroke="#45475a" stroke-width="0.5"/>
    <line x1="200" y1="200" x2="250" y2="150" stroke="#45475a" stroke-width="0.5"/>
    <line x1="300" y1="200" x2="300" y2="150" stroke="#45475a" stroke-width="0.5"/>

    <line x1="0" y1="200" x2="400" y2="200" stroke="#45475a" stroke-width="0.5"/>
    <line x1="37" y1="187" x2="400" y2="187" stroke="#45475a" stroke-width="0.5"/>
    <line x1="75" y1="175" x2="400" y2="175" stroke="#45475a" stroke-width="0.5"/>
    <line x1="112" y1="162" x2="400" y2="162" stroke="#45475a" stroke-width="0.5"/>

    <!-- 3D Surface (simplified mesh) -->
    <!-- Row 1 (back, low values - blue) -->
    <polygon points="150,150 200,145 200,120 150,125" fill="#3b82f6" stroke="#1e40af" stroke-width="0.5"/>
    <polygon points="200,145 250,142 250,118 200,120" fill="#2563eb" stroke="#1e40af" stroke-width="0.5"/>
    <polygon points="250,142 300,140 300,115 250,118" fill="#22d3ee" stroke="#0e7490" stroke-width="0.5"/>
    <polygon points="300,140 350,138 350,110 300,115" fill="#22c55e" stroke="#166534" stroke-width="0.5"/>

    <!-- Row 2 -->
    <polygon points="112,162 175,155 175,95 112,100" fill="#22c55e" stroke="#166534" stroke-width="0.5"/>
    <polygon points="175,155 237,150 237,70 175,95" fill="#84cc16" stroke="#4d7c0f" stroke-width="0.5"/>
    <polygon points="237,150 300,145 300,50 237,70" fill="#eab308" stroke="#a16207" stroke-width="0.5"/>
    <polygon points="300,145 362,142 362,65 300,50" fill="#f97316" stroke="#c2410c" stroke-width="0.5"/>

    <!-- Row 3 -->
    <polygon points="75,175 150,165 150,80 75,95" fill="#84cc16" stroke="#4d7c0f" stroke-width="0.5"/>
    <polygon points="150,165 225,158 225,40 150,80" fill="#eab308" stroke="#a16207" stroke-width="0.5"/>
    <polygon points="225,158 300,152 300,20 225,40" fill="#f97316" stroke="#c2410c" stroke-width="0.5"/>
    <polygon points="300,152 375,148 375,45 300,20" fill="#ef4444" stroke="#b91c1c" stroke-width="0.5"/>

    <!-- Row 4 (front, high values - red peak) -->
    <polygon points="37,187 125,178 125,90 37,100" fill="#f97316" stroke="#c2410c" stroke-width="0.5"/>
    <polygon points="125,178 212,170 212,55 125,90" fill="#ef4444" stroke="#b91c1c" stroke-width="0.5"/>
    <polygon points="212,170 300,164 300,35 212,55" fill="#dc2626" stroke="#991b1b" stroke-width="0.5"/>
    <polygon points="300,164 387,160 387,60 300,35" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.5"/>

    <!-- Row 5 (front edge) -->
    <polygon points="0,200 100,190 100,105 0,115" fill="#ef4444" stroke="#b91c1c" stroke-width="0.5"/>
    <polygon points="100,190 200,182 200,75 100,105" fill="#dc2626" stroke="#991b1b" stroke-width="0.5"/>
    <polygon points="200,182 300,176 300,55 200,75" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.5"/>
    <polygon points="300,176 400,172 400,80 300,55" fill="#991b1b" stroke="#7f1d1d" stroke-width="0.5"/>

    <!-- Axis labels -->
    <text x="200" y="230" fill="#a6adc8" font-family="system-ui" font-size="12" text-anchor="middle">RPM</text>
    <text x="-20" y="130" fill="#a6adc8" font-family="system-ui" font-size="12" text-anchor="middle" transform="rotate(-90,-20,130)">MAP (psi)</text>
    <text x="420" y="120" fill="#a6adc8" font-family="system-ui" font-size="12" text-anchor="start">AFR</text>

    <!-- Axis ticks -->
    <text x="0" y="215" fill="#6c7086" font-family="monospace" font-size="9" text-anchor="middle">1000</text>
    <text x="200" y="215" fill="#6c7086" font-family="monospace" font-size="9" text-anchor="middle">4000</text>
    <text x="400" y="215" fill="#6c7086" font-family="monospace" font-size="9" text-anchor="middle">7000</text>

    <text x="-10" y="205" fill="#6c7086" font-family="monospace" font-size="9" text-anchor="end">-10</text>
    <text x="-10" y="155" fill="#6c7086" font-family="monospace" font-size="9" text-anchor="end">5</text>
    <text x="145" y="145" fill="#6c7086" font-family="monospace" font-size="9" text-anchor="end">15</text>
  </g>

  <!-- Legend (vertical color bar) -->
  <g transform="translate(530, 100)">
    <rect x="0" y="0" width="20" height="150" fill="url(#surfaceGrad)" stroke="#45475a"/>
    <text x="25" y="10" fill="#6c7086" font-family="monospace" font-size="9">11:1</text>
    <text x="25" y="80" fill="#6c7086" font-family="monospace" font-size="9">14:1</text>
    <text x="25" y="155" fill="#6c7086" font-family="monospace" font-size="9">17:1</text>
    <text x="10" y="175" fill="#a6adc8" font-family="system-ui" font-size="10" text-anchor="middle">AFR</text>
  </g>

  <!-- Interaction hints -->
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="500" height="45" fill="#313244" rx="4"/>
    <text x="250" y="18" fill="#cdd6f4" font-family="system-ui" font-size="11" text-anchor="middle">Drag to rotate • Scroll to zoom • Double-click to reset view</text>
    <text x="250" y="36" fill="#6c7086" font-family="system-ui" font-size="10" text-anchor="middle">3D view is read-only. Switch to 2D mode for editing.</text>
  </g>
</svg>
