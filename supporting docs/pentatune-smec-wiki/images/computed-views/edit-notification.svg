<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180">
  <!-- Background -->
  <rect width="500" height="180" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="250" y="20" fill="#cdd6f4" font-family="system-ui" font-size="12" text-anchor="middle" font-weight="bold">Edit Notifications</text>

  <!-- Success notification -->
  <g transform="translate(20, 35)">
    <rect x="0" y="0" width="220" height="55" fill="#166534" rx="6" stroke="#22c55e" stroke-width="1"/>
    <circle cx="22" cy="27" r="12" fill="#22c55e"/>
    <path d="M16,27 L20,31 L28,23" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="22" fill="white" font-family="system-ui" font-size="11" font-weight="bold">Edit applied</text>
    <text x="42" y="38" fill="#bbf7d0" font-family="system-ui" font-size="10">Modified: FuelPartThrottle[3,4]</text>
    <text x="42" y="50" fill="#86efac" font-family="system-ui" font-size="9">Achieved: 14.15 AFR (target: 14.2)</text>
  </g>

  <!-- Warning notification -->
  <g transform="translate(260, 35)">
    <rect x="0" y="0" width="220" height="55" fill="#854d0e" rx="6" stroke="#eab308" stroke-width="1"/>
    <circle cx="22" cy="27" r="12" fill="#eab308"/>
    <text x="22" y="32" fill="#1e1e2e" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="bold">!</text>
    <text x="42" y="22" fill="white" font-family="system-ui" font-size="11" font-weight="bold">Unusual value</text>
    <text x="42" y="38" fill="#fef08a" font-family="system-ui" font-size="10">AFR 5.5 is outside typical range</text>
    <text x="42" y="50" fill="#fde047" font-family="system-ui" font-size="9">Typical: 8-20 AFR. Edit applied anyway.</text>
  </g>

  <!-- Error notification -->
  <g transform="translate(20, 105)">
    <rect x="0" y="0" width="220" height="55" fill="#7f1d1d" rx="6" stroke="#ef4444" stroke-width="1"/>
    <circle cx="22" cy="27" r="12" fill="#ef4444"/>
    <text x="22" y="32" fill="white" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="bold">X</text>
    <text x="42" y="22" fill="white" font-family="system-ui" font-size="11" font-weight="bold">Invalid input</text>
    <text x="42" y="38" fill="#fecaca" font-family="system-ui" font-size="10">'abc' is not a valid number</text>
    <text x="42" y="50" fill="#fca5a5" font-family="system-ui" font-size="9">Please enter a numeric value.</text>
  </g>

  <!-- Min/Max notification -->
  <g transform="translate(260, 105)">
    <rect x="0" y="0" width="220" height="55" fill="#1e3a5f" rx="6" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="22" cy="27" r="12" fill="#3b82f6"/>
    <text x="22" y="32" fill="white" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="bold">i</text>
    <text x="42" y="22" fill="white" font-family="system-ui" font-size="11" font-weight="bold">Partial edit (min/max)</text>
    <text x="42" y="38" fill="#bfdbfe" font-family="system-ui" font-size="10">Modified: MAPTBL (active source)</text>
    <text x="42" y="50" fill="#93c5fd" font-family="system-ui" font-size="9">Skipped: WOTTBL (inactive at this point)</text>
  </g>
</svg>
