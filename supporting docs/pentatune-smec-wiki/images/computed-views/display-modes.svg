<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <!-- Background -->
  <rect width="600" height="200" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="300" y="25" fill="#cdd6f4" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="bold">Display Mode Selector</text>

  <!-- Mode buttons container -->
  <rect x="50" y="45" width="500" height="50" fill="#313244" rx="6"/>

  <!-- Raw mode (inactive) -->
  <rect x="55" y="50" width="95" height="40" fill="#45475a" rx="4"/>
  <text x="102" y="75" fill="#a6adc8" font-family="system-ui" font-size="12" text-anchor="middle" font-weight="bold">Raw (us)</text>

  <!-- AFR mode (active) -->
  <rect x="155" y="50" width="95" height="40" fill="#3b82f6" rx="4"/>
  <text x="202" y="75" fill="white" font-family="system-ui" font-size="12" text-anchor="middle" font-weight="bold">AFR</text>

  <!-- Lambda mode (inactive) -->
  <rect x="255" y="50" width="95" height="40" fill="#45475a" rx="4"/>
  <text x="302" y="75" fill="#a6adc8" font-family="system-ui" font-size="12" text-anchor="middle" font-weight="bold">Lambda</text>

  <!-- VE% mode (inactive) -->
  <rect x="355" y="50" width="95" height="40" fill="#45475a" rx="4"/>
  <text x="402" y="75" fill="#a6adc8" font-family="system-ui" font-size="12" text-anchor="middle" font-weight="bold">VE%</text>

  <!-- 2D/3D toggle -->
  <rect x="455" y="50" width="90" height="40" fill="#45475a" rx="4"/>
  <text x="480" y="75" fill="#22c55e" font-family="system-ui" font-size="12" text-anchor="middle" font-weight="bold">2D</text>
  <text x="500" y="75" fill="#6c7086" font-family="system-ui" font-size="12" text-anchor="middle">/</text>
  <text x="520" y="75" fill="#6c7086" font-family="system-ui" font-size="12" text-anchor="middle" font-weight="bold">3D</text>

  <!-- Example values for each mode -->
  <g transform="translate(50, 110)">
    <text x="47" y="15" fill="#6c7086" font-family="system-ui" font-size="10" text-anchor="middle">Same cell in different modes:</text>

    <!-- Raw value -->
    <rect x="5" y="25" width="95" height="30" fill="#313244" rx="3"/>
    <text x="52" y="45" fill="#cdd6f4" font-family="monospace" font-size="13" text-anchor="middle">4523 us</text>

    <!-- AFR value -->
    <rect x="105" y="25" width="95" height="30" fill="#3b82f6" rx="3"/>
    <text x="152" y="45" fill="white" font-family="monospace" font-size="13" text-anchor="middle">13.8 AFR</text>

    <!-- Lambda value -->
    <rect x="205" y="25" width="95" height="30" fill="#313244" rx="3"/>
    <text x="252" y="45" fill="#cdd6f4" font-family="monospace" font-size="13" text-anchor="middle">0.94 λ</text>

    <!-- VE% value -->
    <rect x="305" y="25" width="95" height="30" fill="#313244" rx="3"/>
    <text x="352" y="45" fill="#cdd6f4" font-family="monospace" font-size="13" text-anchor="middle">87.2%</text>
  </g>

  <!-- Arrows showing conversion -->
  <path d="M 102 155 L 152 155" stroke="#585b70" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M 202 155 L 252 155" stroke="#585b70" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M 302 155 L 352 155" stroke="#585b70" stroke-width="1" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#585b70"/>
    </marker>
  </defs>

  <!-- Footer note -->
  <text x="300" y="185" fill="#6c7086" font-family="system-ui" font-size="10" text-anchor="middle">Click a mode button to switch. Values convert automatically using injector size and displacement.</text>
</svg>
